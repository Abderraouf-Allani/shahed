name: Build site and deploy to GitHub Pages

# Architecture (see AGENTS.md / research notes):
#
#   data/gharib.json          source of truth — committed to git,
#   (never published)         str->str, "" = section marker
#             |
#             | this workflow (validated split)
#             v
#   _site/data/gharib/index.json    all non-empty keys (~16 KB, fetched once)
#   _site/data/gharib/e/<key>.txt   one definition per entry (raw key as
#                                   filename; the client builds the URL with
#                                   encodeURIComponent(key), the server decodes
#                                   it back to the raw filename)
#
# Clients transfer ~17 KB per first lookup instead of the 2.6 MB JSON.
#
# Trigger: the whole repository IS the Pages site, so every push to main
# must deploy (app.js/styles/data changes ship too). Deliberately no
# `paths:` filter — restricting it to gharib.json would silently skip
# ordinary site updates.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site and split the gharib dictionary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Assemble site (allowlist — only these paths are publishable)
        run: |
          mkdir -p _site
          rsync -a --exclude='.DS_Store' \
            index.html app.js styles.css sw.js lab.js memhide.js plans.js \
            manifest.webmanifest loader-star.html USER_GUIDE.md \
            fonts icons lib \
            _site/
          # data/*.json are FILE sources: rsync copies a file source into the
          # destination directory by basename, dropping its data/ prefix — so
          # they must target _site/data/ explicitly (this bug shipped every
          # allowlisted data file at the site root; /data/*.json 404'd).
          mkdir -p _site/data
          rsync -a --exclude='.DS_Store' \
            data/adib.json data/ahzab.json data/asarar.json data/dawaa.json \
            data/hafs.json data/jam3.json data/numbering.json \
            data/ontology.json data/quran.json data/surahs.json \
            _site/data/

      - name: Verify assembled site (every allowlisted path landed, no leaks)
        run: |
          missing=0
          for f in index.html app.js styles.css sw.js lab.js memhide.js plans.js \
                   manifest.webmanifest loader-star.html USER_GUIDE.md \
                   data/adib.json data/ahzab.json data/asarar.json data/dawaa.json \
                   data/hafs.json data/jam3.json data/numbering.json \
                   data/ontology.json data/quran.json data/surahs.json \
                   fonts icons lib; do
            if [ -d "_site/$f" ]; then continue; fi
            if [ ! -s "_site/$f" ]; then echo "MISSING _site/$f"; missing=1; fi
          done
          for f in data/gharib.json data/quran-new.json AGENTS.md; do
            if [ -e "_site/$f" ]; then echo "LEAK _site/$f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "allowlist OK: $(find _site -type f | wc -l) files"

      - name: Validate data/gharib.json and generate static resources
        run: |
          python3 <<'PY'
          import json
          import sys
          from pathlib import Path

          SOURCE = Path("data/gharib.json")
          OUTPUT = Path("_site/data/gharib")
          ENTRIES = OUTPUT / "e"

          data = json.loads(SOURCE.read_text(encoding="utf-8"))

          if not isinstance(data, dict):
              sys.exit("data/gharib.json: root must be a JSON object")

          # Schema: string key -> string definition ("" = section marker).
          for key, value in data.items():
              if not isinstance(key, str):
                  sys.exit(f"data/gharib.json: non-string key {key!r}")
              if not isinstance(value, str):
                  sys.exit(
                      f"data/gharib.json: definition for {key!r} must be a "
                      f"string, got {type(value).__name__}"
                  )

          # Empty definitions are section markers, not entries — same rule
          # the application applies when loading the full dictionary.
          keys = [key for key, value in data.items() if value]

          # Entry filenames are the raw keys, so they must be safe on disk.
          for key in keys:
              size = len(key.encode("utf-8"))
              if size > 200:
                  sys.exit(f"data/gharib.json: key too long for a filename ({size} B): {key!r}")
              if "/" in key or "\n" in key or "\x00" in key or key in (".", ".."):
                  sys.exit(f"data/gharib.json: key not filesystem-safe: {key!r}")

          ENTRIES.mkdir(parents=True, exist_ok=True)

          (OUTPUT / "index.json").write_text(
              json.dumps(keys, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          for key in keys:
              (ENTRIES / f"{key}.txt").write_text(data[key], encoding="utf-8")

          # Consistency: silent corruption must fail the deployment.
          generated = list(ENTRIES.glob("*.txt"))
          if len(generated) != len(keys):
              sys.exit(f"generated {len(generated)} entry files, expected {len(keys)}")
          empty = [path.name for path in generated if path.stat().st_size == 0]
          if empty:
              sys.exit(f"generated empty definition files: {empty}")

          index_size = (OUTPUT / "index.json").stat().st_size
          print(f"index.json: {index_size} bytes / {len(keys)} keys")
          print(f"entries:    {len(generated)} files")
          PY

      - name: Verify client URL mapping (encodeURIComponent -> server decode -> file)
        run: |
          node <<'JS'
          const fs = require('fs');
          const dir = '_site/data/gharib/e/';
          const keys = JSON.parse(fs.readFileSync('_site/data/gharib/index.json', 'utf8'));
          const missing = keys.filter(function (key) {
            const url = 'data/gharib/e/' + encodeURIComponent(key) + '.txt';
            const decoded = decodeURIComponent(url.split('/').pop());
            return !fs.existsSync(dir + decoded);
          });
          if (missing.length) {
            console.error('no file for ' + missing.length + ' key(s), e.g. ' + JSON.stringify(missing.slice(0, 3)));
            process.exit(1);
          }
          console.log('URL mapping OK for ' + keys.length + ' keys');
          JS

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
