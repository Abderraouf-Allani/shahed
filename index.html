<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="شاهد من القرآن — مصحف كامل برواية قالون عن نافع مع نظام الوسوم والآيات">
  <title>شاهد من القرآن — رواية قالون عن نافع</title>
  <meta name="theme-color" content="#1e5a3c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="شاهد من القرآن">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>

  <div id="loader" class="loader" role="status" aria-live="polite">
    <div class="loader-istiaadha" id="loaderIstiaadha" dir="rtl"></div>
    <div class="loader-caption">تُحمَّل البيانات…</div>
  </div>

  <script>
    (function () {
      var TEXT = 'أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ';
      var loader = document.getElementById('loader');
      var istiaadha = document.getElementById('loaderIstiaadha');
      var letters = [];
      var done = false;

      var chars;
      try {
        var seg = new Intl.Segmenter('ar', { granularity: 'grapheme' });
        chars = Array.from(seg.segment(TEXT), function (s) { return s.segment; });
      } catch (e) {
        chars = Array.from(TEXT);
      }

      chars.forEach(function (ch) {
        if (ch.trim() === '') {
          istiaadha.appendChild(document.createTextNode(' '));
          return;
        }
        var span = document.createElement('span');
        span.className = 'istiaadha-letter';
        span.textContent = ch;
        istiaadha.appendChild(span);
        letters.push(span);
      });

      window.__quranLoader = {
        progress: function (frac) {
          if (done) return;
          var n = Math.round(Math.max(0, Math.min(1, frac)) * letters.length);
          for (var i = 0; i < letters.length; i++) {
            letters[i].classList.toggle('lit', i < n);
          }
        },
        done: function () {
          if (done) return;
          done = true;
          letters.forEach(function (l) { l.classList.add('lit'); });
          var caption = loader.querySelector('.loader-caption');
          if (caption) caption.textContent = '';
          loader.classList.add('loader-ready');
          setTimeout(function () {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 900);
        }
      };
    })();
  </script>

  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <a class="brand-title" href="#/">شاهد من القرآن</a>
        <button type="button" class="brand-sub" id="riwayaToggle" title="تبديل الرواية (قالون / حفص)" aria-label="تبديل الرواية">رواية قالون عن نافع</button>
      </div>
      <a class="header-reading" id="headerReading" href="#/" hidden></a>
      <a class="icon-btn" href="#/tags" aria-label="الوسوم" title="الوسوم">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/>
          <circle cx="7.5" cy="7.5" r="1.3" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a class="icon-btn" href="#/memorize" aria-label="الحفظ" title="الحفظ">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
      </a>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="تبديل المظهر" title="تبديل المظهر">
        <svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/>
            <line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/>
            <line x1="4.9" y1="4.9" x2="6.6" y2="6.6"/><line x1="17.4" y1="17.4" x2="19.1" y2="19.1"/>
            <line x1="4.9" y1="19.1" x2="6.6" y2="17.4"/><line x1="17.4" y1="6.6" x2="19.1" y2="4.9"/>
          </g>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="app" class="app-main"></main>

  <footer class="app-footer">
    <p>مصحف مجمّع الملك فهد لطباعة المصحف الشريف — رواية قالون عن نافع</p>
    <p><button type="button" id="licenseLink" class="license-link">التراخيص والمصادر</button></p>
  </footer>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
