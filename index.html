<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="القرآن الكريم كاملاً برواية قالون عن نافع">
  <title>القرآن الكريم — رواية قالون عن نافع</title>
  <meta name="theme-color" content="#1e5a3c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="القرآن الكريم">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>

  <div id="loader" class="loader" role="status" aria-live="polite">
    <svg class="loader-star" viewBox="-120 -120 240 240" aria-hidden="true">
      <circle class="loader-ring" cx="0" cy="0" r="108"/>
      <g class="loader-spikes"></g>
      <path class="loader-core"/>
    </svg>
    <div class="loader-caption">تُحمَّل البيانات…</div>
  </div>

  <script>
    (function () {
      var SPIKES = 8;
      var RT = 100;
      var RN = 100 * Math.sqrt(2 - Math.sqrt(2));
      var NS = 'http://www.w3.org/2000/svg';
      function pt(r, deg) {
        var a = deg * Math.PI / 180;
        return [r * Math.cos(a), r * Math.sin(a)];
      }
      function el(tag, attrs) {
        var e = document.createElementNS(NS, tag);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        return e;
      }
      var svg = document.getElementById('loader').querySelector('.loader-star');
      var spikesG = svg.querySelector('.loader-spikes');
      var spikes = [];
      for (var k = 0; k < SPIKES; k++) {
        var deg = k * 45;
        var tip = pt(RT, deg);
        var n1 = pt(RN, deg - 22.5);
        var n2 = pt(RN, deg + 22.5);
        var p = el('path', {
          'class': 'loader-spike',
          'd': 'M0 0 L' + n1[0] + ' ' + n1[1] + ' L' + tip[0] + ' ' + tip[1] + ' L' + n2[0] + ' ' + n2[1] + ' Z'
        });
        spikesG.appendChild(p);
        spikes.push(p);
      }
      var coreD = '';
      for (var m = 0; m < SPIKES; m++) {
        var n = pt(RN, m * 45 + 22.5);
        coreD += (m ? ' L' : 'M') + n[0] + ' ' + n[1];
      }
      coreD += ' Z';
      svg.querySelector('.loader-core').setAttribute('d', coreD);

      var loader = document.getElementById('loader');
      var caption = loader.querySelector('.loader-caption');
      var done = false;
      window.__quranLoader = {
        progress: function (frac) {
          if (done) return;
          var n = Math.round(Math.max(0, Math.min(1, frac)) * SPIKES);
          for (var i = 0; i < SPIKES; i++) spikes[i].classList.toggle('lit', i < n);
        },
        done: function () {
          if (done) return;
          done = true;
          for (var i = 0; i < SPIKES; i++) spikes[i].classList.add('lit');
          svg.querySelector('.loader-core').classList.add('lit');
          if (caption) caption.textContent = '';
          loader.classList.add('loader-ready');
          setTimeout(function () {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 800);
        }
      };
    })();
  </script>

  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="#/">
        <span class="brand-title">القرآن الكريم</span>
        <span class="brand-sub">رواية قالون عن نافع</span>
      </a>
      <a class="icon-btn" href="#/tags" aria-label="الوسوم" title="الوسوم">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/>
          <circle cx="7.5" cy="7.5" r="1.3" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="تبديل المظهر" title="تبديل المظهر">
        <svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/>
            <line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/>
            <line x1="4.9" y1="4.9" x2="6.6" y2="6.6"/><line x1="17.4" y1="17.4" x2="19.1" y2="19.1"/>
            <line x1="4.9" y1="19.1" x2="6.6" y2="17.4"/><line x1="17.4" y1="6.6" x2="19.1" y2="4.9"/>
          </g>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="app" class="app-main"></main>

  <footer class="app-footer">
    <p>مصحف مجمّع الملك فهد لطباعة المصحف الشريف — رواية قالون عن نافع</p>
  </footer>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
